name: validate runs
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/comparison_taxonomy.py && git diff --exit-code comparison/
      - run: python3 scripts/hard_cases.py && git diff --exit-code questions/hard-cases.json
      - run: python3 scripts/validate.py
